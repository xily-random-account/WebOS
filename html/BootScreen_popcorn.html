<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebPopcorn Boot</title>

<style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    /* Center container */
    .boot-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }

    /* Popcorn logo */
    .popcorn-logo {
        font-size: 60px;
        font-weight: bold;
        animation: logoPop 1.2s ease-out forwards;
    }

    /* Loading bar */
    .loading-bar {
        width: 300px;
        height: 8px;
        background: #333;
        margin: 20px auto;
        border-radius: 4px;
        overflow: hidden;
    }

    .loading-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(180deg,
                #d4f0ff 0%,
                #00a891 100%
            );
        animation: loadAnim 5s ease-in forwards;
    }


    /* Logo animation */
    @keyframes logoPop {
        from {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.7) rotate3d(50, 50, 59)
        }
        to {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate3d(0,0,0);

        }
    }

    /* Loading animation */
    @keyframes loadAnim {
        from { width: 0%; }
        to { width: 100%; }
    }

    /* Fade out before desktop */
    @keyframes fadeOut {
        to { opacity: 0; }
    }
</style>
</head>

<body>

<div class="boot-center" id="boot">
    <div class="popcorn-logo">WebOS</div>
    <div class="loading-bar">
        <div class="loading-fill"></div>
    </div>
    <p>Copyright OpenFiddles @ 2026</p>
</div>

<script>
    // After loading animation finishes, fade out and redirect
    setTimeout(() => {
        const boot = document.getElementById("boot");
        boot.style.animation = "fadeOut 0.8s ease-out forwards";

        setTimeout(() => {
            window.location.href = "../html/DisplayManager_PopIT.html"; // change to your desktop file
        }, 800);

    }, 5000); // wait for loading bar to finish
</script>

</body>
</html>
