<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebPopcorn Boot</title>

<style>
    body {
        margin: 0;
        background: black;
        color: white;
        font-family: system-ui, sans-serif;
        overflow: hidden;
    }

    /* Center container */
    .boot-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
    }

    /* Popcorn logo */
    .popcorn-logo {
        font-size: 60px;
        font-weight: bold;
        animation: logoPop 1.2s ease-out forwards;
    }

    /* Loading bar */
    .loading-bar {
        width: 300px;
        height: 8px;
        background: #333;
        margin: 20px auto;
        border-radius: 4px;
        overflow: hidden;
    }

    .boot-status {
        min-height: 1.2em;
        color: #a8b8c4;
        font-size: 13px;
    }

    .skip-boot {
        border: 1px solid #376337;
        border-radius: 6px;
        padding: 8px 12px;
        background: #142014;
        color: #d8ffd8;
        cursor: pointer;
    }

    .skip-boot:focus-visible {
        outline: 2px solid #7ee8dc;
        outline-offset: 3px;
    }

    .loading-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(180deg,
                #d4f0ff 0%,
                #00a891 100%
            );
        animation: loadAnim 5s ease-in forwards;
    }


    /* Logo animation */
    @keyframes logoPop {
        from {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.7) rotate3d(50, 50, 59)
        }
        to {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1) rotate3d(0,0,0);

        }
    }

    /* Loading animation */
    @keyframes loadAnim {
        from { width: 0%; }
        to { width: 100%; }
    }

    /* Fade out before desktop */
    @keyframes fadeOut {
        to { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
        .popcorn-logo,
        .loading-fill {
            animation: none;
        }

        .loading-fill {
            width: 100%;
        }
    }
</style>
</head>

<body>

<main class="boot-center" id="boot" aria-labelledby="boot-title">
    <div class="popcorn-logo" id="boot-title">WebOS</div>
    <div class="loading-bar">
        <div class="loading-fill" role="progressbar" aria-label="Starting WebOS"></div>
    </div>
    <p class="boot-status" id="boot-status" aria-live="polite">Starting desktop services...</p>
    <button class="skip-boot" id="skip-boot" type="button">Continue to desktop</button>
</main>

<script>
    const boot = document.getElementById("boot");
    const status = document.getElementById("boot-status");
    const skipButton = document.getElementById("skip-boot");
    let redirected = false;

    function openDesktop() {
        if (redirected) return;
        redirected = true;
        status.textContent = "Opening desktop...";
        const boot = document.getElementById("boot");
        boot.style.animation = "fadeOut 0.8s ease-out forwards";
        setTimeout(() => {
            window.location.href = "../html/DisplayManager_PopIT.html";
        }, 800);
    }

    skipButton.addEventListener("click", openDesktop);
    window.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") openDesktop();
    });
    setTimeout(openDesktop, 5000);
</script>

</body>
</html>
