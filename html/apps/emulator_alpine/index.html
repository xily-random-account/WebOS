<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Interactive Terminal</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d0d0d; color: #33ff33;
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
        }

        #terminal-wrapper {
            display: flex; flex-direction: column;
            width: 100%; height: 100%; box-sizing: border-box;
            padding: 10px;
        }

        #mode-toolbar {
            display: flex; align-items: center; gap: 8px;
            padding-bottom: 8px; border-bottom: 1px solid #224422;
            color: #9aa7b2; font-size: 12px;
            flex-wrap: wrap;
        }

        #display-mode, #restart-guest {
            background: #142014; color: #d8ffd8;
            border: 1px solid #376337; border-radius: 4px;
            font: inherit; padding: 4px 7px;
        }

        #restart-guest { cursor: pointer; }

        #boot-progress {
            width: 120px;
            height: 6px;
            accent-color: #33ff33;
        }

        #vga-display {
            flex: 1; min-height: 0; overflow: auto;
            display: block; background: #000; margin-bottom: 8px;
            border: 1px solid #224422;
        }

        #vga-display canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }

        #serial-console {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        /* Displays the text rolling out from Alpine Linux */
        #output-display {
            flex: 1; overflow-y: auto; white-space: pre-wrap;
            font-size: 14px; margin-bottom: 8px; line-height: 1.3;
            display: none;
        }

        /* Input field area */
        #input-container {
            display: flex; align-items: center;
            border-top: 1px solid #224422; padding-top: 8px;
        }

        #prompt-label {
            color: #88ff88; font-weight: bold; margin-right: 8px;
            white-space: nowrap; user-select: none;
        }

        #user-input {
            flex: 1; background: transparent; border: none;
            color: #fff; font-family: inherit; font-size: 14px;
            outline: none; caret-color: #33ff33;
        }

        .system { color: #9aa7b2; }
        .command { color: #ffffff; }
        .error { color: #ff8d8d; }
    </style>
    <!-- Copy.sh v86 runtime is kept with the emulator assets. -->
    <script src="libv86.js"></script>
    <script src="asset-config.js"></script>
</head>
<body>

    <div id="terminal-wrapper">
        <div id="mode-toolbar">
            <label for="display-mode">Display</label>
            <select id="display-mode" aria-label="Alpine display mode">
                <option value="vga">VGA display</option>
                <option value="serial">Serial console</option>
            </select>
            <button id="restart-guest" type="button">Restart guest</button>
            <progress id="boot-progress" max="100" value="0" aria-label="Alpine boot progress"></progress>
            <span id="mode-status">Preparing Alpine boot...</span>
        </div>
        <!-- Terminal buffer output dumps here -->
        <div id="output-display"><span class="system">WebOS Terminal | Alpine Linux guest</span></div>
        <div id="vga-display" aria-label="Alpine VGA display"></div>
        <textarea id="serial-console" aria-label="Alpine serial console" tabindex="-1"></textarea>

        <!-- Interactive Form Element for Inputs -->
        <div id="input-container">
            <span id="prompt-label">webos:~$</span>
            <input type="text" id="user-input" autocomplete="off" placeholder="Type webos or Linux command..." />
        </div>
    </div>

    <script>
        const outputDisplay = document.getElementById("output-display");
        const vgaDisplay = document.getElementById("vga-display");
        const serialConsole = document.getElementById("serial-console");
        const userInput = document.getElementById("user-input");
        const promptLabel = document.getElementById("prompt-label");
        const displayMode = document.getElementById("display-mode");
        const modeStatus = document.getElementById("mode-status");
        const bootProgress = document.getElementById("boot-progress");
        const restartGuest = document.getElementById("restart-guest");
        let emulator = null;
        let guestReady = false;

        const savedMode = new URLSearchParams(window.location.search).get("display");
        if (savedMode === "vga" || savedMode === "serial") displayMode.value = savedMode;

        function isVgaMode() {
            return displayMode.value === "vga";
        }

        function updateDisplayMode() {
            const vga = isVgaMode();
            outputDisplay.style.display = vga ? "none" : "block";
            vgaDisplay.style.display = vga ? "block" : "none";
            modeStatus.textContent = vga
                ? "VGA sends typed input to the guest keyboard."
                : "Serial is recommended for command mode.";
            userInput.placeholder = vga
                ? "Type into the Alpine VGA console..."
                : "Type webos or Linux command...";
        }

        function printToConsole(text, className) {
            const line = document.createElement("span");
            line.className = className || "";
            line.textContent = text;
            outputDisplay.appendChild(line);
            outputDisplay.scrollTop = outputDisplay.scrollHeight; // Auto scroll down
        }

        function printLine(text, className) {
            printToConsole(text + "\n", className);
        }

        function sendToWebOS(action, payload) {
            if (window.parent !== window) {
                window.parent.postMessage({ source: "webos-terminal", action, ...payload }, window.location.origin);
                return true;
            }
            printLine("This terminal is not running inside WebOS.", "error");
            return false;
        }

        function runWebOSCommand(command) {
            const parts = command.trim().split(/\s+/);
            const action = parts[1] || "help";
            const argument = parts.slice(2).join(" ");

            if (action === "help") {
                printLine("webos open <url>     Open a URL in the WebOS browser");
                printLine("webos apps            List installed WebOS apps");
                printLine("webos launch <app>    Open a WebOS app");
                printLine("webos status           Show desktop connection status");
                return true;
            }
            if (action === "open") {
                if (!/^https?:\/\//i.test(argument)) {
                    printLine("Usage: webos open https://example.com", "error");
                } else if (sendToWebOS("open-url", { url: argument })) {
                    printLine("Opening " + argument);
                }
                return true;
            }
            if (action === "apps") {
                printLine("Installed apps: terminal, browser, calculator, notes");
                return true;
            }
            if (action === "launch") {
                if (sendToWebOS("launch-app", { app: argument || "terminal" })) {
                    printLine("Launching " + (argument || "terminal"));
                }
                return true;
            }
            if (action === "status") {
                printLine("WebOS desktop: connected");
                printLine("Alpine guest: " + (guestReady ? "ready" : "booting"));
                return true;
            }
            printLine("Unknown webos command. Try: webos help", "error");
            return true;
        }

        // 1. Initialize the Alpine WASM Environment
        window.addEventListener("load", () => {
            updateDisplayMode();
            printLine("[WebOS] Starting Alpine guest...", "system");

            try {
                const asset = window.WebOSAlpine.asset;
                const emulatorOptions = {
                    wasm_path: asset("v86.wasm"),
                    bios: { url: asset("seabios.bin") },
                    vga_bios: { url: asset("vgabios.bin") },
                    cdrom: { url: asset("alpine.iso") },
                    boot_order: 0x213,
                    memory_size: 128 * 1024 * 1024,
                    vga_memory_size: 8 * 1024 * 1024,
                    autostart: true,
                    screen_container: vgaDisplay,
                    serial_container: serialConsole
                };
                emulator = new V86(emulatorOptions);
            } catch (error) {
                printLine("[Alpine] Failed to start: " + error.message, "error");
                modeStatus.textContent = "Boot failed. Check the ISO and v86 assets.";
                bootProgress.value = 0;
                printLine("WebOS commands remain available.", "system");
                return;
            }

            // 2. Intercept character outputs streaming out of Linux
            emulator.add_listener("serial0-output-char", function(char) {
                printToConsole(char);
                
                // Once Alpine boots completely to shell login prompt, enable input box
                if (outputDisplay.textContent.includes("login:") || outputDisplay.textContent.includes("localhost:~#")) {
                    guestReady = true;
                    promptLabel.textContent = "alpine:~#";
                }
            });

            emulator.add_listener("emulator-ready", function() {
                printLine("[Alpine] Guest CPU ready. Type webos help for desktop commands.", "system");
                modeStatus.textContent = "Alpine guest ready.";
                bootProgress.value = 100;
            });

            emulator.add_listener("download-progress", function(progress) {
                if (!progress || !progress.total) return;
                const percent = Math.round((progress.loaded / progress.total) * 100);
                bootProgress.value = percent;
                modeStatus.textContent = "Loading " + (progress.file_name || "v86 asset") + "... " + percent + "%";
            });

            emulator.add_listener("emulator-stopped", function() {
                modeStatus.textContent = "Alpine guest stopped.";
            });

            emulator.add_listener("emulator-started", function() {
                modeStatus.textContent = isVgaMode()
                    ? "VGA guest started. Click the display or type below."
                    : "Serial guest started.";
            });
        });

        displayMode.addEventListener("change", () => {
            const query = new URLSearchParams(window.location.search);
            query.set("display", displayMode.value);
            window.location.search = query.toString();
        });

        restartGuest.addEventListener("click", () => {
            if (emulator && typeof emulator.destroy === "function") emulator.destroy();
            window.location.reload();
        });

        // 3. Handle processing input commands from the text box
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const command = userInput.value.trim();
                if (!command) return;
                printLine((guestReady ? "alpine:~# " : "webos:~$ ") + command, "command");

                if (/^webos(?:\s|$)/i.test(command)) {
                    runWebOSCommand(command);
                } else if (emulator) {
                    if (isVgaMode() && typeof emulator.keyboard_send_text === "function") {
                        emulator.keyboard_send_text(command + "\n");
                    } else {
                        emulator.serial0_send(command + "\n");
                    }
                } else {
                    printLine("Alpine is still starting. Try `webos status`.", "error");
                }
                
                userInput.value = ""; // Clear input for next command
            }
        });

        // Keep input box focused whenever clicking anywhere inside the app window
        document.addEventListener("click", () => userInput.focus());
    </script>
</body>
</html>
