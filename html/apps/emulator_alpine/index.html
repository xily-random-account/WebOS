<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Alpine Terminal</title>
    <style>
        :root { color-scheme: dark; --ink: #d9f7e3; --muted: #789184; --line: #214334; --accent: #80e6a3; }
        * { box-sizing: border-box; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07100c; color: var(--ink); font-family: "Courier New", monospace; }
        #terminal-wrapper { display: flex; flex-direction: column; width: 100%; height: 100%; padding: 12px; background: radial-gradient(circle at 80% 0, #123324 0, transparent 42%), #07100c; }
        #mode-toolbar { display: flex; align-items: center; gap: 9px; padding-bottom: 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; flex-wrap: wrap; }
        #restart-guest { background: #10271b; color: var(--ink); border: 1px solid #35684b; border-radius: 4px; font: inherit; padding: 5px 9px; cursor: pointer; }
        #boot-progress { width: 120px; height: 6px; accent-color: var(--accent); }
        #output-display { flex: 1; min-height: 0; overflow-y: auto; white-space: pre-wrap; padding: 14px 4px 10px; font-size: 14px; line-height: 1.45; }
        #input-container { display: flex; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; }
        #prompt-label { color: var(--accent); font-weight: bold; margin-right: 8px; white-space: nowrap; user-select: none; }
        #user-input { min-width: 0; flex: 1; background: transparent; border: none; color: #fff; font: inherit; outline: none; caret-color: var(--accent); }
        .system { color: var(--muted); } .command { color: #fff; } .error { color: #ff9a9a; }
    </style>
    <script src="asset-config.js"></script>
</head>
<body>
    <div id="terminal-wrapper">
        <div id="mode-toolbar">
            <span>ALPINE / CHEERPX</span>
            <button id="restart-guest" type="button">Restart</button>
            <progress id="boot-progress" max="100" value="0" aria-label="Alpine boot progress"></progress>
            <span id="mode-status" aria-live="polite">Preparing Alpine userspace...</span>
        </div>
        <div id="output-display"><span class="system">WebOS Terminal | Alpine Linux userspace via CheerpX\n</span></div>
        <div id="input-container">
            <span id="prompt-label">webos:~$</span>
            <input type="text" id="user-input" autocomplete="off" placeholder="Type webos or an Alpine command..." />
        </div>
    </div>

    <script type="module">
        import { Linux, HttpBytesDevice } from "https://cxrtnc.leaningtech.com/1.0.8/cx.esm.js";

        const outputDisplay = document.getElementById("output-display");
        const userInput = document.getElementById("user-input");
        const promptLabel = document.getElementById("prompt-label");
        const modeStatus = document.getElementById("mode-status");
        const bootProgress = document.getElementById("boot-progress");
        const restartGuest = document.getElementById("restart-guest");
        let linux = null;
        let shell = null;
        let shellInput = null;
        let guestReady = false;

        function printToConsole(text, className) {
            const line = document.createElement("span");
            line.className = className || "";
            line.textContent = text;
            outputDisplay.appendChild(line);
            outputDisplay.scrollTop = outputDisplay.scrollHeight; // Auto scroll down
        }

        function printLine(text, className) {
            printToConsole(text + "\n", className);
        }

        function sendToWebOS(action, payload) {
            if (window.parent !== window) {
                window.parent.postMessage({ source: "webos-terminal", action, ...payload }, window.location.origin);
                return true;
            }
            printLine("This terminal is not running inside WebOS.", "error");
            return false;
        }

        function runWebOSCommand(command) {
            const parts = command.trim().split(/\s+/);
            const action = parts[1] || "help";
            const argument = parts.slice(2).join(" ");

            if (action === "help") {
                printLine("webos open <url>     Open a URL in the WebOS browser");
                printLine("webos apps            List installed WebOS apps");
                printLine("webos launch <app>    Open a WebOS app");
                printLine("webos status           Show desktop connection status");
                return true;
            }
            if (action === "open") {
                if (!/^https?:\/\//i.test(argument)) {
                    printLine("Usage: webos open https://example.com", "error");
                } else if (sendToWebOS("open-url", { url: argument })) {
                    printLine("Opening " + argument);
                }
                return true;
            }
            if (action === "apps") {
                printLine("Installed apps: terminal, browser, calculator, notes");
                return true;
            }
            if (action === "launch") {
                if (sendToWebOS("launch-app", { app: argument || "terminal" })) {
                    printLine("Launching " + (argument || "terminal"));
                }
                return true;
            }
            if (action === "status") {
                printLine("WebOS desktop: connected");
                printLine("Alpine guest: " + (guestReady ? "ready" : "booting"));
                return true;
            }
            printLine("Unknown webos command. Try: webos help", "error");
            return true;
        }

        async function startGuest() {
            if (shellInput) shellInput.close();
            linux = null;
            shell = null;
            shellInput = null;
            guestReady = false;
            promptLabel.textContent = "webos:~$";
            bootProgress.value = 0;
            modeStatus.textContent = "Loading Alpine root filesystem...";
            printLine("[WebOS] Starting Alpine userspace with CheerpX...", "system");

            try {
                const rootfs = await HttpBytesDevice.create(window.WebOSAlpine.rootfsUrl);
                linux = await Linux.create({
                    mounts: [{ type: "ext2", path: "/", dev: rootfs }]
                });
                bootProgress.value = 60;
                modeStatus.textContent = "Starting Alpine shell...";
                shell = await linux.run("/bin/sh", ["-l"], {
                    cwd: "/root",
                    env: ["HOME=/root", "TERM=xterm-256color", "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"]
                });
                shellInput = shell.input.getWriter();
                shell.output.pipeTo(new WritableStream({ write: (data) => printToConsole(data) }));
                guestReady = true;
                promptLabel.textContent = "alpine:~#";
                bootProgress.value = 100;
                modeStatus.textContent = "Alpine shell ready.";
                printLine("\n[Alpine] Guest ready. Type webos help for desktop commands.", "system");
            } catch (error) {
                const detail = error && error.message ? error.message : String(error);
                printLine("[Alpine] Failed to start: " + detail, "error");
                modeStatus.textContent = "Boot failed. Check the root filesystem network request.";
                bootProgress.value = 0;
                printLine("WebOS commands remain available.", "system");
                return;
            }
        }

        window.addEventListener("load", startGuest);

        restartGuest.addEventListener("click", () => {
            window.location.reload();
        });

        // 3. Handle processing input commands from the text box
        userInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                const command = userInput.value.trim();
                if (!command) return;
                printLine((guestReady ? "alpine:~# " : "webos:~$ ") + command, "command");

                if (/^webos(?:\s|$)/i.test(command)) {
                    runWebOSCommand(command);
                } else if (shellInput) {
                    shellInput.write(command + "\n");
                } else {
                    printLine("Alpine is still starting. Try `webos status`.", "error");
                }
                
                userInput.value = ""; // Clear input for next command
            }
        });

        // Keep input box focused whenever clicking anywhere inside the app window
        document.addEventListener("click", (event) => {
            if (event.target.closest("select, input, textarea, button")) return;
            userInput.focus();
        });
    </script>
</body>
</html>
