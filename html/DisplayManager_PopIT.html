<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebPopcorn DisplayManager</title>
    <link rel="stylesheet" href="../css/universal_css_native_stuff.css"/>

<style>
/* ---------- GLOBAL ---------- */

body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: radial-gradient(circle at top, #1b2735, #090a0f);
    color: white;
    overflow: hidden;
}

/* ---------- LIQUID GLASS BASE ---------- */

.glass {
    background: rgba(20, 20, 30, 0.55);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(18px) saturate(140%);
}

/* ---------- TASKBAR + DOCK ---------- */

#taskbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 9000;
    background: linear-gradient(180deg, rgba(10,10,20,0.85), rgba(5,5,10,0.9));
    backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
}

#taskbar-left {
    display: flex;
    align-items: center;
    gap: 8px;
}

#taskbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    opacity: 0.8;
}

#open-launcher {
    font-size: 18px;
    padding: 4px 10px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, #00eaff, #0066ff);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 18px rgba(0,0,0,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

#open-launcher:hover {
    transform: translateY(-1px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.5);
}

/* iOS-style dock */

#dock {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 18px;
    display: flex;
    gap: 14px;
    align-items: center;
    max-width: 420px;
}

.dock-glass {
    background: rgba(20, 20, 30, 0.55);
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    backdrop-filter: blur(22px) saturate(150%);
}

.DockIcon {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: linear-gradient(135deg, #00eaff, #0066ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.DockIcon:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 16px 30px rgba(0,0,0,0.7);
}

/* ---------- WINDOWS (LIQUID GLASS) ---------- */

.WindowDesign {
    width: 360px;
    height: 230px;
    position: absolute;
    top: 70px;
    left: 40px;
    overflow: hidden;
}

.WindowShell {
    width: 100%;
    height: 100%;
}

.WindowShell.glass {
    border-radius: 18px;
}

.WindowTitleBar {
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: move;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.WindowButtons {
    display: flex;
    gap: 6px;
}

.WindowButtons span {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
}

.WindowBody {
    padding: 10px;
    font-size: 13px;
}

.EmulatorWindow .WindowBody {
    display: flex;
    padding: 0;
    overflow: hidden;
    background: #0d0d0d;
}

.EmulatorFrame {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 420px;
    border: 0;
    background: #0d0d0d;
}

.BrowserShell {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    gap: 8px;
}

.BrowserBar {
    display: flex;
    gap: 6px;
}

.BrowserAddress {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    background: rgba(0,0,0,0.35);
    color: white;
}

.BrowserBar button {
    padding: 0 14px;
    border: 0;
    border-radius: 6px;
    background: #00a891;
    color: white;
    cursor: pointer;
}

.BrowserFrame {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: 0;
    background: white;
}

/* resize handle */

.ResizeHandle {
    width: 12px;
    height: 12px;
    background: rgba(255,255,255,0.25);
    position: absolute;
    right: 6px;
    bottom: 6px;
    border-radius: 4px;
    cursor: se-resize;
}

/* ---------- LAUNCHER (FULLSCREEN, LIQUID GLASS) ---------- */

.LauncherFS {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at top, rgba(0,0,0,0.75), rgba(0,0,0,0.95));
    backdrop-filter: blur(26px) saturate(160%);
    z-index: 9500;
    opacity: 0;
    pointer-events: none;
    transform: translateY(20px) scale(0.98);
    transition:
        opacity 0.28s ease-out,
        transform 0.32s cubic-bezier(0.23, 0.9, 0.35, 1.2);
}

.LauncherFS.active {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0) scale(1);
}

/* launcher content */

.LauncherInner {
    max-width: 720px;
    margin: 80px auto 0 auto;
    padding: 24px 26px 30px 26px;
}

.LauncherHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    font-size: 14px;
    opacity: 0.85;
}

.LauncherGrid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
}

/* app icons */

.AppIcon {
    background: linear-gradient(135deg, rgba(0,234,255,0.9), rgba(0,102,255,0.9));
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    font-size: 16px;
    color: white;
    font-weight: 600;
    box-shadow: 0 14px 30px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
}

.AppIcon:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 18px 36px rgba(0,0,0,0.75);
}

/* ---------- DESKTOP ---------- */

#Desktop {
    width: 100%;
    height: 100vh;
    position: relative;
    padding-top: 42px;
}

/* ---------- UTILITY ---------- */

.hidden {
    display: none;
}
</style>
</head>

<body>

<!-- ---------- WINDOW TEMPLATE ---------- -->

<div class="WindowDesign hidden" id="WindowTemplate">
    <div class="WindowShell glass">
        <div class="ResizeHandle"></div>

        <div class="WindowTitleBar">
            <span>Window Title</span>
            <div class="WindowButtons">
                <span class="Minimize">–</span>
                <span class="Maximize">□</span>
                <span class="Close">×</span>
            </div>
        </div>

        <div class="WindowBody">
            Window content goes here.
        </div>
    </div>
</div>

<!-- ---------- DESKTOP + TASKBAR + DOCK ---------- -->

<div id="Desktop">

    <div id="taskbar">
        <div id="taskbar-left">
            <button id="open-launcher">☰</button>
            <span>WebPopcorn OS</span>
        </div>
        <div id="taskbar-right">
            <span>DisplayManager</span>
        </div>
    </div>

    <div id="dock" class="dock-glass">
        <div class="DockIcon" onclick="openEmulator()">A</div>
        <div class="DockIcon" onclick="createWindow('Notes','Notes app coming soon.')">N</div>
        <div class="DockIcon" onclick="openCalculator()">C</div>
        <div class="DockIcon" onclick="createWindow('Settings','Settings panel coming soon.')">S</div>
    </div>

</div>

<!-- ---------- FULLSCREEN LAUNCHER ---------- -->

<div id="Launcher" class="LauncherFS">
    <div class="LauncherInner glass">
        <div class="LauncherHeader">
            <span>Launcher</span>
            <span>Tap outside to close</span>
        </div>
        <div class="LauncherGrid">
            <div class="AppIcon" onclick="openEmulator()">Alpine Linux</div>
            <div class="AppIcon" onclick="createWindow('Notes','Notes app coming soon.')">Notes</div>
            <div class="AppIcon" onclick="openCalculator()">Calculator</div>
            <div class="AppIcon" onclick="createWindow('Settings','Settings panel coming soon.')">Settings</div>
            <div class="AppIcon" onclick="createWindow('Gallery','Gallery app coming soon.')">Gallery</div>
            <div class="AppIcon" onclick="createWindow('Null','Null app placeholder.')">Null</div>
            <div class="AppIcon" onclick="createWindow('Null','Null app placeholder.')">Null</div>
            <div class="AppIcon" onclick="openEmulator()">Terminal</div>
            <div class="AppIcon" onclick="createWindow('About','WebPopcorn OS prototype.')">About</div>
        </div>
    </div>
</div>

<!-- ---------- SCRIPT ---------- -->

<script>
/* WINDOW CREATION */

function createWindow(title, content) {
    const template = document.getElementById("WindowTemplate");
    const win = template.cloneNode(true);

    win.classList.remove("hidden");
    win.id = "Window_" + Date.now();

    win.querySelector(".WindowTitleBar span").textContent = title;
    win.querySelector(".WindowBody").innerHTML = content;

    win.style.left = (40 + Math.random() * 80) + "px";
    win.style.top = (80 + Math.random() * 80) + "px";

    makeWindowDraggable(win);
    makeWindowResizable(win);
    wireWindowButtons(win);

    document.body.appendChild(win);
    return win;
}

/* DRAGGING */

function makeWindowDraggable(win) {
    const titleBar = win.querySelector(".WindowTitleBar");
    let offsetX = 0, offsetY = 0, isDragging = false;

    titleBar.addEventListener("mousedown", (e) => {
        isDragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        win.style.left = (e.clientX - offsetX) + "px";
        win.style.top = (e.clientY - offsetY) + "px";
    });

    document.addEventListener("mouseup", () => {
        isDragging = false;
    });
}

/* RESIZING */

function makeWindowResizable(win) {
    const handle = win.querySelector(".ResizeHandle");
    let isResizing = false;

    handle.addEventListener("mousedown", (e) => {
        isResizing = true;
        e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
        if (!isResizing) return;
        win.style.width = e.clientX - win.offsetLeft + "px";
        win.style.height = e.clientY - win.offsetTop + "px";
    });

    document.addEventListener("mouseup", () => {
        isResizing = false;
    });
}

/* WINDOW BUTTONS */

function wireWindowButtons(win) {
    const closeBtn = win.querySelector(".Close");
    const minimizeBtn = win.querySelector(".Minimize");
    const maximizeBtn = win.querySelector(".Maximize");

    closeBtn.onclick = () => win.remove();
    minimizeBtn.onclick = () => win.style.display = "none";
    maximizeBtn.onclick = () => {
        win.style.left = "20px";
        win.style.top = "60px";
        win.style.width = (window.innerWidth - 40) + "px";
        win.style.height = (window.innerHeight - 100) + "px";
    };
}

/* LAUNCHER LOGIC */

const launcher = document.getElementById("Launcher");
const launcherBtn = document.getElementById("open-launcher");

launcherBtn.onclick = () => {
    launcher.classList.add("active");
};

launcher.onclick = (e) => {
    if (e.target === launcher) {
        launcher.classList.remove("active");
    }
};

/* CALCULATOR (simple iframe window) */

function openCalculator() {
    const content = '<iframe src="https://www.desmos.com/calculator" style="width:100%;height:100%;border:none;border-radius:12px;"></iframe>';
    createWindow("Calculator", content);
}

function openBrowser(initialUrl) {
    const win = createWindow("WebOS Browser", '<div class="BrowserShell"><form class="BrowserBar"><input class="BrowserAddress" type="url" placeholder="https://example.com" autocomplete="off"><button type="submit">Go</button></form><iframe class="BrowserFrame" title="WebOS browser" sandbox="allow-forms allow-modals allow-popups allow-scripts allow-same-origin"></iframe></div>');
    win.style.width = Math.min(window.innerWidth - 40, 900) + "px";
    win.style.height = Math.min(window.innerHeight - 110, 620) + "px";
    win.style.left = Math.max(20, (window.innerWidth - parseInt(win.style.width, 10)) / 2) + "px";
    win.style.top = "68px";

    const address = win.querySelector(".BrowserAddress");
    const frame = win.querySelector(".BrowserFrame");
    const navigate = (url) => {
        try {
            const parsed = new URL(url);
            if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("unsupported protocol");
            address.value = parsed.href;
            frame.src = parsed.href;
        } catch (error) {
            address.value = "";
            address.placeholder = "Only http:// and https:// URLs are supported";
        }
    };
    win.querySelector(".BrowserBar").addEventListener("submit", (event) => {
        event.preventDefault();
        navigate(address.value);
    });
    navigate(initialUrl || "https://example.com");
    return win;
}

function launchApp(app) {
    switch ((app || "terminal").toLowerCase()) {
        case "browser":
            return openBrowser();
        case "calculator":
            return openCalculator();
        case "notes":
            return createWindow("Notes", '<iframe src="/html/apps/notebook.html" style="width:100%;height:100%;border:none;"></iframe>');
        case "terminal":
        case "alpine":
            return openEmulator();
        default:
            return createWindow("WebOS", "Unknown app: " + app);
    }
}

window.addEventListener("message", (event) => {
    if (event.origin !== window.location.origin || !event.data || event.data.source !== "webos-terminal") return;
    if (event.data.action === "open-url") {
        openBrowser(event.data.url);
    } else if (event.data.action === "launch-app") {
        launchApp(event.data.app);
    }
});

function openEmulator() {
    launcher.classList.remove("active");
    const content = '<iframe class="EmulatorFrame" src="/html/apps/emulator_alpine/index.html" title="Alpine Linux emulator" allow="fullscreen"></iframe>';
    const win = createWindow("Alpine Linux", content);

    win.classList.add("EmulatorWindow");
    win.style.width = Math.min(window.innerWidth - 40, 820) + "px";
    win.style.height = Math.min(window.innerHeight - 110, 560) + "px";
    win.style.left = Math.max(20, (window.innerWidth - parseInt(win.style.width, 10)) / 2) + "px";
    win.style.top = "68px";
}
</script>

</body>
</html>
